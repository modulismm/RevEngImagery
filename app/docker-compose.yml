services:
  imagery:
    build: .
    container_name: imagery
    restart: unless-stopped
    ports:
      # Never 0.0.0.0 -- that would expose this to the whole LAN, bypassing any
      # proxy. IMAGERY_BIND picks the interface:
      #   172.17.0.1  (default) docker0 gateway, for nginx-proxy-manager on armitage
      #   127.0.0.1             localhost only, for `tailscale serve` in front
      # See ../docs/deploy.md.
      - "${IMAGERY_BIND:-172.17.0.1}:${IMAGERY_PORT:-8010}:8000"
    volumes:
      - imagery_data:/data
    environment:
      # Set on first run only; afterwards the account exists in the database.
      - IMAGERY_ADMIN=${IMAGERY_ADMIN:-bear}
      - IMAGERY_ADMIN_PASSPHRASE=${IMAGERY_ADMIN_PASSPHRASE:-}
      # Cookies are Secure by default; set 0 only for plain-HTTP local testing.
      - IMAGERY_SECURE_COOKIE=${IMAGERY_SECURE_COOKIE:-1}
    security_opt:
      - no-new-privileges:true

volumes:
  imagery_data:
